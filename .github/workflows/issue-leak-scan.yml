name: Issue + PR Body Leak Scan

# Thin caller — logic in org-shared reusable workflow:
#   RevealUIStudio/.github/.github/workflows/issue-leak-scan-reusable.yml
# Requires .gitleaks.issues.toml on this repo's default branch.
# Name rules come from the CLIENT_LEAK_PATTERNS secret, passed explicitly to the shared workflow.

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: leak-scan-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  scan:
    uses: revealui-studio/.github/.github/workflows/issue-leak-scan-reusable.yml@ed893dec79c02c60604d566a03ddfb305e9358fe
    secrets:
      client_leak_patterns: ${{ secrets.CLIENT_LEAK_PATTERNS }}
