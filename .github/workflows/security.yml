name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # gitleaks CLI binary (MIT, free). The gitleaks-action wrapper requires a
      # paid license for organization accounts and fails on Dependabot PRs.
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --no-banner --redact \
            --report-path /tmp/gitleaks-report.json --report-format json

  no-submodules:
    name: Submodule Audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Ensure no git submodules
        run: |
          if [ -f .gitmodules ]; then
            printf 'FAIL: .gitmodules found — submodules are prohibited\n' >&2
            exit 1
          fi
          printf 'OK: no submodules\n'
