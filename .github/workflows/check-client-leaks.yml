name: Client Name Leak Scan

# Runs the in-repo scanner. The property is unconditional: no CHANGELOG skip.

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

permissions:
  contents: read

jobs:
  scan:
    name: Client / prospect name leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan for client and prospect names
        run: bash scripts/check-client-leaks.sh
