<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RevealUI — Marketing UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50:  '#e3eafc',
            100: '#c2cfeb',
            200: '#9eb6dc',
            300: '#4485bd',
            400: '#004F8C',
            500: '#003E7A',
            600: '#001540',
            700: '#00112e',
            800: '#000a1f',
            900: '#000513',
          },
          accent: {
            50:  '#fff5e0',
            100: '#fde7b8',
            200: '#fbd987',
            300: '#f7c14b',
            400: '#e8a420',
            500: '#c98a00',
            600: '#8c5d00',
            700: '#5e3d00',
            800: '#3a2600',
            900: '#1f1400',
          }
        }
      }
    }
  }
</script>
<style>
  /* Cobalt token set — inlined from @revealui/presentation design-context (self-contained) */
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap");
  :root {
    --rvui-font-sans: "Inter", system-ui, sans-serif;
    --rvui-font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    --rvui-font-display: "Inter Tight", "Inter", system-ui, sans-serif;
    --rvui-tracking-tight: -0.02em;
    --rvui-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --rvui-duration-fast: 120ms;
    --rvui-duration-normal: 200ms;
    --rvui-duration-slow: 350ms;
    --rvui-radius-sm: 6px; --rvui-radius-md: 10px; --rvui-radius-lg: 16px; --rvui-radius-xl: 24px;
    /* Cobalt brand (light surface) */
    --rvui-brand: #003E7A;
    --rvui-brand-hover: #004F8C;
    --rvui-brand-strong: #001540;
    --rvui-brand-soft: rgba(0,62,122,0.14);
    --rvui-brand-glow: rgba(0,62,122,0.42);
    --rvui-cobalt-50: #e3eafc; --rvui-cobalt-200: #9eb6dc; --rvui-cobalt-300: #4485bd;
    --rvui-cobalt-400: #004F8C; --rvui-cobalt-500: #003E7A; --rvui-cobalt-600: #001540;
    /* Accent — Solar Amber */
    --rvui-accent: #f0b519;
    --rvui-accent-soft: rgba(240,181,25,0.14);
    --rvui-accent-glow: rgba(240,181,25,0.36);
    /* Marketing surfaces (light-first) */
    --rvui-surface-0: #f8fafc;
    --rvui-surface-1: #ffffff;
    --rvui-surface-2: #f1f5fa;
    --rvui-text-0: #0a1320;
    --rvui-text-1: #2a3a52;
    --rvui-text-2: #4f6580;
    --rvui-text-on-brand: #f8fafc;
    --rvui-border: rgba(10,19,32,0.08);
    --rvui-border-subtle: rgba(10,19,32,0.04);
    /* shadcn bridge */
    --primary: var(--rvui-brand);
    --ring: var(--rvui-brand);
    --radius: var(--rvui-radius-md);
  }
  body { font-family: var(--rvui-font-sans); -webkit-font-smoothing: antialiased; }
  .font-display { font-family: var(--rvui-font-display); }
  .font-mono { font-family: var(--rvui-font-mono); font-feature-settings: "liga" 0; }
</style>
</head>
<body class="bg-white text-brand-900" data-screen-label="Marketing UI Kit">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="NavBar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Pricing.jsx"></script>
  <script type="text/babel" src="Faq.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <NavBar />
          <main>
            <Hero />
            <Primitives />
            <Pricing />
            <Faq />
          </main>
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
